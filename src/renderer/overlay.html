<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'none'; style-src 'self'; script-src 'self';"
    />
    <title>Craft Overlay — предмет</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div class="ov-shell">
      <header id="ov-titlebar" class="ov-titlebar">
        <div class="ov-titlebar-drag">
          <span class="ov-title">Craft Overlay</span>
          <span class="ov-title-hint">Alt+F — новый предмет</span>
        </div>
        <div class="ov-titlebar-actions">
          <button id="ov-minimize" class="ov-tb-btn" type="button" title="Свернуть оверлей">—</button>
          <button id="ov-close" class="ov-tb-btn ov-tb-close" type="button" title="Закрыть приложение">×</button>
        </div>
      </header>
      <div id="ov-root" class="ov-root" aria-live="polite"></div>
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
